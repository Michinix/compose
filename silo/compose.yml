services:
  silo:
    image: docker.io/pgsty/silo:latest
    container_name: pgsty-silo
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - silo_data:/data
    command: server /data --console-address ":9001"

volumes:
  silo_data:
