services:
    mailpit:
        image: axllent/mailpit:latest
        container_name: mailpit
        restart: unless-stopped
        ports:
            - "8025:8025"
            - "1025:1025"
        environment:
            - MP_DATA_FILE=/data/mailpit.db
        volumes:
            - mailpit_data:/data

volumes:
    mailpit_data:
